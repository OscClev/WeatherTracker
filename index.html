<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FloodWatch NY</title>

<link
href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div id="sidebar">

    <input
        id="searchBox"
        placeholder="Search a town, city, or river...">
    <!-- Live search results appear here -->
    <div id="searchResults"></div>


    <div id="filterPanel">

        <h3>Filter Gauges</h3>

        <div class="filter-buttons">

            <button id="selectAll">
                Select All
            </button>

            <button id="clearAll">
                Clear All
            </button>

        </div>


        <div id="filters">

            <label>
                <input type="checkbox" value="no_flooding" checked>
                <span class="green filter-dot"></span>
                Normal
            </label>

            <label>
                <input type="checkbox" value="action" checked>
                <span class="yellow filter-dot"></span>
                Action
            </label>

            <label>
                <input type="checkbox" value="minor" checked>
                <span class="orange filter-dot"></span>
                Minor
            </label>

            <label>
                <input type="checkbox" value="moderate" checked>
                <span class="red filter-dot"></span>
                Moderate
            </label>

            <label>
                <input type="checkbox" value="major" checked>
                <span class="purple filter-dot"></span>
                Major
            </label>

            <label>
                <input type="checkbox" value="missing" checked>
                <span class="gray filter-dot"></span>
                Not Reporting
            </label>

        </div>

    </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>

<script type="module" src="frontend/js/app.js"></script>

</body>

</html>
